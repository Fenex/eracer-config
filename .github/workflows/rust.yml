name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust Win7 toolchain
      uses: Fenex/setup-rust-win7@master
      with:
        version: latest
        arch: x86_64
        cache: true

    - name: Run tests
      run: cargo test --verbose
    - name: Build Release
      run: cargo build --release --verbose
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: eracer-config
        path: target/release/eracer-config.exe
